# Mobile client CI.
#
# What this is for
#   Running the checks that would otherwise only happen on whoever's laptop
#   last touched the code: lint, typecheck and tests, on every push and pull
#   request. The capstone guidelines require a pipeline that builds and tests on
#   every push by Week 10.
#
# Why these four steps and not more
#   They are the checks that can run honestly without a device. A simulator
#   build, a screenshot comparison or an end-to-end run would need hardware this
#   pipeline does not have, and a check that cannot really run is worse than no
#   check — it reports green while proving nothing.
#
# Where the backend's checks are
#   Not here. The backend has its own `backend-ci` workflow, kept separate so
#   the two fail independently and each can be a required status check on
#   `main`. Job ids become check names and must be unique across workflows:
#   this job is `verify`, the backend's are `backend-verify` and
#   `backend-audit`. Neither is a required check yet — the `main-protection`
#   ruleset asks for review and squash merges but does not gate on CI.

name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run, so a series of quick
# fixes does not queue five redundant jobs.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Everything lives in mobile/, so each step runs from there rather than
    # repeating `cd mobile &&`.
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node major the team develops on. Expo SDK 57 needs 20+.
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file says and fails if package.json and the lock have drifted, so CI
      # tests the dependency tree a teammate would actually get.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --coverage --ci

      # Uploaded rather than gated on a threshold for now. The specification
      # sets a 75% floor rising each sprint; adding `--coverage-fail-under`
      # belongs with Phase 4, once the screens that carry most of the logic
      # exist and the number means something.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 14
