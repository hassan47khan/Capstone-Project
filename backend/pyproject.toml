# Tool configuration for the backend. Not a package; dependencies live in the
# requirements files.

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by makemigrations, not written by hand, so their
# formatting is Django's to decide.
extend-exclude = ["*/migrations/*", "mongo_migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "venv/*",
    "*/migrations/*",
    "mongo_migrations/*",
    "*/tests/*",
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
]
