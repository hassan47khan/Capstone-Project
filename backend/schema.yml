    SubscriptionInputRequest:
      type: object
      description: POST /subscriptions, PATCH /subscriptions/{id} (partial), POST
        /extractions/{id}/confirm.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        billing_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        billing_currency:
          type: string
          minLength: 1
          default: USD
          description: ISO 4217 code the subscription is billed in.
          pattern: ^[A-Z]{3}$
        billing_cycle:
          allOf:
          - $ref: '#/components/schemas/BillingCycleEnum'
          default: monthly
        custom_cycle_count:
          type:
          - integer
          - 'null'
          maximum: 365
          minimum: 1
        custom_cycle_unit:
          oneOf:
          - $ref: '#/components/schemas/CustomCycleUnitEnum'
          - $ref: '#/components/schemas/NullEnum'
        start_date:
          type: string
          format: date
          description: The first charge. next_bill_date is derived from it, never
            sent.
        category:
          type: string
          minLength: 1
          description: Category slug, e.g. `entertainment`.
        notes:
          type: string
          default: ''
          maxLength: 280
        payment_label:
          type: string
          default: ''
          description: Display only, e.g. 'Visa ••4242'. A card number is rejected.
          maxLength: 30
        is_trial:
          type: boolean
          default: false
        trial_ends_on:
          type:
          - string
          - 'null'
          format: date
        trial_length_days:
          type:
          - integer
          - 'null'
          maximum: 366
          minimum: 1
        trial_reminder_enabled:
          type: boolean
          default: true
      required:
      - billing_price
      - category
      - name
      - start_date
